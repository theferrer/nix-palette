# While the stack is private, this repo's checks run from nix-dotfiles' CI
# (its `palette` job checks this repo out with a read-only token - the
# palette's own runner cannot fetch the private canvas input). Manual runs
# stay available; restore the push/pull_request triggers on publication.
name: CI

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix flake check
